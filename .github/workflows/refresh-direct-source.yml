name: Refresh direct-source index

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-source-production-refresh
  cancel-in-progress: false

jobs:
  refresh-mpp:
    name: Refresh MPP rolling windows
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TEMPO_RPC_URL: ${{ secrets.TEMPO_RPC_URL }}
      DIRECT_SOURCE_INGEST_URL: ${{ secrets.DIRECT_SOURCE_INGEST_URL }}
      DIRECT_SOURCE_INGEST_TOKEN: ${{ secrets.DIRECT_SOURCE_INGEST_TOKEN }}
      PRODUCTION_ORIGIN: https://agenticpaymentsindex.org
      FRESHNESS_MAX_AGE_HOURS: "30"
      REFRESH_PROTOCOLS: mpp
      REFRESH_WINDOWS: 1,7,30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh exact rolling windows
        run: npm run direct:refresh

      - name: Summarize the refresh method
        run: |
          echo "MPP refreshes from Tempo payment events."

  refresh-x402:
    name: Refresh x402 rolling windows
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
      DIRECT_SOURCE_INGEST_URL: ${{ secrets.DIRECT_SOURCE_INGEST_URL }}
      DIRECT_SOURCE_INGEST_TOKEN: ${{ secrets.DIRECT_SOURCE_INGEST_TOKEN }}
      X402_SQD_SLICE_CONCURRENCY: "4"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh exact rolling windows
        run: npm run direct:refresh:x402

      - name: Summarize the refresh method
        run: |
          echo "x402 refreshes from Base authorization and transfer events through SQD Portal."
          echo "Pass-through legs collapse to one payment attributed to its terminal recipient."

  verify-production:
    name: Verify combined production freshness
    needs: [refresh-mpp, refresh-x402]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_ORIGIN: https://agenticpaymentsindex.org
      FRESHNESS_MAX_AGE_HOURS: "30"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production freshness and all-time coverage
        run: npm run data:freshness
